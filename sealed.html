<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bindex — Pagina spostata</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f3eeff;
            --card-bg: #ffffff;
            --primary: #7c4dff;
            --primary-light: #ede7ff;
            --primary-dark: #5e35b1;
            --text-dark: #2a2438;
            --text-muted: #756a8a;
            --border-color: #e2d9f3;
            --success: #2e7d32;
            --success-bg: #e8f5e9;
            --shadow-soft: 0 4px 20px rgba(124, 77, 255, 0.08);
        }

        /* TEMA VERDE PASTELLO */
        body.theme-verde {
            --bg-color: #eef7f2;
            --primary: #2e7d32;
            --primary-light: #e0f2e1;
            --primary-dark: #1b5e20;
            --text-dark: #1b2e22;
            --text-muted: #647d6a;
            --border-color: #cee2d4;
            --shadow-soft: 0 4px 20px rgba(46, 125, 50, 0.08);
        }

        /* TEMA POKEMON */
        body.theme-pokemon {
            --bg-color: #edf4fc;
            --primary: #2a75d3;
            --primary-light: #dbeafe;
            --primary-dark: #18529d;
            --text-dark: #1a2738;
            --text-muted: #5e728c;
            --border-color: #cbdcf2;
            --shadow-soft: 0 4px 20px rgba(42, 117, 211, 0.08);
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-color: #121018;
            --card-bg: #1c1826;
            --text-dark: #f1edfa;
            --text-muted: #9f95b5;
            --border-color: #2f2840;
            --primary-light: rgba(124, 77, 255, 0.2);
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode.theme-verde {
            --bg-color: #0d1712;
            --card-bg: #14241b;
            --text-dark: #e8f5ed;
            --text-muted: #83a38c;
            --border-color: #1f382a;
            --primary-light: rgba(46, 125, 50, 0.2);
        }

        body.dark-mode.theme-pokemon {
            --bg-color: #0f1621;
            --card-bg: #172130;
            --text-dark: #eaf2fd;
            --text-muted: #829ab8;
            --border-color: #23344a;
            --primary-light: rgba(42, 117, 211, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh; /* iOS Safari: la barra indirizzi dinamica
                                    cambia 100vh in continuazione — dvh si
                                    adatta subito, senza "salti" di layout */
            /* spazio per la barra totale fissa in basso, + l'home indicator
               di iPhone (barra bianca in fondo, senza tasto Home fisico) */
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Press Start 2P', monospace;
            font-weight: 400;
            font-size: 0.85rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        @media (max-width: 420px) {
            .logo { font-size: 0.7rem; }
        }

        .logo img { width: 24px; height: 24px; object-fit: contain; }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            font-weight: 600;
        }

        .container {
            max-width: 720px;
            margin: 1.2rem auto;
            padding: 0 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-soft);
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            padding-left: 0.6rem;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .card-row {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--shadow-soft);
            transition: border-color 0.15s, background-color 0.15s;
        }

        .card-row.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .card-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .card-thumb {
            width: 32px; height: 44px; object-fit: cover; border-radius: 4px;
            flex-shrink: 0; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .card-info { flex: 1; min-width: 0; }

        .card-name {
            font-weight: 700;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.3rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 7px;
            font-size: 0.68rem;
            font-weight: 700;
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .card-price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-dark);
            white-space: nowrap;
            text-align: right;
            min-width: 62px;
        }

        .card-price small {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .qty-btn {
            background-color: var(--primary-light);
            color: var(--primary);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }

        .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .qty-value {
            width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .stato-vuoto, .stato-caricamento, .stato-errore {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stato-errore { color: #d32f2f; }

        .barra-totale {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            padding: 0.9rem 1.2rem;
            /* iPhone senza tasto Home: aggiunge lo spazio dell'home indicator
               SOPRA al padding normale, così il bottone non ci finisce sotto */
            padding-bottom: calc(0.9rem + env(safe-area-inset-bottom));
            padding-left: calc(1.2rem + env(safe-area-inset-left));
            padding-right: calc(1.2rem + env(safe-area-inset-right));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            z-index: 60;
        }

        .barra-totale-info { line-height: 1.3; }
        .barra-totale-count { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; }
        .barra-totale-value { font-size: 1.25rem; font-weight: 800; color: var(--primary); }

        .btn-copia {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-copia:disabled { opacity: 0.5; cursor: not-allowed; }

        /* A16: pulsante "Filtri" espandibile — il pannello resta chiuso di
           default per non occupare spazio fisso, coerente con la scelta di
           Claudio di tenerlo dietro un tocco invece che sempre visibile. */
        .btn-filtri {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-soft);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            width: 100%;
        }
        .btn-filtri i.fa-chevron-down { margin-left: auto; transition: transform 0.2s; color: var(--text-muted); }
        .btn-filtri.aperto i.fa-chevron-down { transform: rotate(180deg); }
        #filtriAttiviCount {
            background-color: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.68rem;
            padding: 0.1rem 0.5rem;
        }

        .pannello-filtri {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            margin-top: -0.5rem;
            box-shadow: var(--shadow-soft);
        }
        .pannello-filtri.aperto { display: block; }

        .filtro-gruppo-titolo {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        /* Pillole lingua — selezione MULTIPLA: ogni pillola si accende/
           spegne in modo indipendente dalle altre. */
        .filtro-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            margin-right: 0.35rem;
            margin-bottom: 0.35rem;
        }
        .filtro-pill.attivo {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Slider doppio prezzo — costruito su misura con due <input
           type="range"> sovrapposti (nessuna libreria esterna, coerente
           col resto del progetto). Solo le manopole sono cliccabili
           (pointer-events sul thumb, non sulla barra), così i due cursori
           non si "rubano" il click a vicenda. */
        .price-slider-wrap { position: relative; height: 32px; margin: 0.3rem 0 0.2rem; }
        .price-slider-track {
            position: absolute; top: 50%; left: 0; right: 0; height: 4px;
            background-color: var(--border-color); border-radius: 2px;
            transform: translateY(-50%);
        }
        .price-slider-range {
            position: absolute; top: 50%; height: 4px;
            background-color: var(--primary); border-radius: 2px;
            transform: translateY(-50%);
        }
        .price-slider-wrap input[type="range"] {
            position: absolute; top: 50%; left: 0; width: 100%;
            transform: translateY(-50%);
            -webkit-appearance: none; appearance: none;
            background: transparent; pointer-events: none; margin: 0;
        }
        .price-slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; pointer-events: auto;
            width: 18px; height: 18px; border-radius: 50%;
            background-color: var(--primary); cursor: pointer;
            border: 2px solid var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .price-slider-wrap input[type="range"]::-moz-range-thumb {
            pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
            background-color: var(--primary); cursor: pointer;
            border: 2px solid var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .price-slider-labels {
            display: flex; justify-content: space-between;
            font-size: 0.75rem; color: var(--text-muted); font-weight: 700;
        }

        .btn-reset-filtri {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0.4rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-reset-filtri:hover { color: var(--primary); }
    
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
               font-family: 'Space Grotesk', sans-serif; background: var(--bg-color); color: var(--text-dark); }
        .spostata { max-width: 420px; width: 100%; background: var(--card-bg); border: 1px solid var(--border-color);
                    border-radius: 20px; padding: 2rem 1.5rem; text-align: center; box-shadow: var(--shadow-soft); }
        .spostata i.grande { font-size: 2.2rem; color: var(--primary); margin-bottom: 0.8rem; }
        .spostata h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        .spostata p { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 1.2rem; line-height: 1.45; }
        .spostata a.btn { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--primary); color: #fff;
                          text-decoration: none; font-weight: 700; padding: 0.7rem 1.2rem; border-radius: 12px; }
        .spostata a.btn[hidden] { display: none; }
    </style>
</head>
<body>
    <div class="spostata">
        <i class="fa-solid fa-box-open grande"></i>
        <h1>Questa pagina si è spostata</h1>
        <p id="spostataTesto">I prodotti sealed condivisi ora si trovano nello Scaffale Scambio. Cerco quello di chi ti ha mandato il link…</p>
        <a id="spostataLink" class="btn" href="#" hidden><i class="fa-solid fa-arrow-right"></i> Apri lo Scaffale Scambio</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="config/supabase.js" data-client="pubblico"></script>
    <script src="data/pubblico.repository.js"></script>
    <script>
        // Stesso tema scelto dal proprietario nel link (nessun login qui).
        (function () {
            const params = new URLSearchParams(window.location.search);
            const tema = params.get('tema');
            if (tema === 'verde' || tema === 'pokemon') document.body.classList.add('theme-' + tema);
            if (params.get('scuro') === '1') document.body.classList.add('dark-mode');
        })();

        (async function () {
            const params = new URLSearchParams(window.location.search);
            const testo = document.getElementById('spostataTesto');
            const link = document.getElementById('spostataLink');
            const owner = params.get('u');
            const fallback = 'I prodotti sealed condivisi ora si trovano nello Scaffale Scambio. Chiedi a chi ti ha mandato il link di inviartene uno aggiornato.';
            if (!owner) { testo.textContent = fallback; return; }
            try {
                const { data, error } = await pubblicoScaffaleScambioDaOwner(owner);
                if (error || !data) { testo.textContent = fallback; return; }
                const url = new URL('scaffali-pubblico.html', window.location.href);
                url.searchParams.set('u', owner);
                url.searchParams.set('scaffale', data);
                ['tema', 'scuro'].forEach(k => { if (params.get(k)) url.searchParams.set(k, params.get(k)); });
                link.href = url.href;
                link.hidden = false;
                testo.textContent = 'I prodotti sealed condivisi ora si trovano nello Scaffale Scambio.';
            } catch (e) {
                console.error('[sealed spostata]', e);
                testo.textContent = fallback;
            }
        })();
    </script>
</body>
</html>
